services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${PBM_SA_PASSWORD:?Set PBM_SA_PASSWORD in .env}"
    ports:
      - "1433:1433"
    volumes:
      - pbm_sql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '$${MSSQL_SA_PASSWORD}' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: src/PBM.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__PbmDatabase: "Server=db,1433;Database=PerformanceBudgetManagement;User Id=sa;Password=${PBM_SA_PASSWORD:?Set PBM_SA_PASSWORD in .env};TrustServerCertificate=True;Encrypt=False"
      Jwt__Key: "${PBM_JWT_KEY:?Set PBM_JWT_KEY in .env}"
      Jwt__Issuer: PBM
      Jwt__Audience: PBM.Web
      IntegrationAuth__TokenMinutes: "${PBM_INTEGRATION_TOKEN_MINUTES:-30}"
      Database__AutoMigrate: "false"
      Database__AllowEnsureCreated: "true"
      Bootstrap__UseDemoSeed: "true"
      Bootstrap__ProvisionInitialTenant: "false"
      BootstrapAdmin__UserName: "admin"
      BootstrapAdmin__DisplayName: "مدیر کل سامانه"
      BootstrapAdmin__Password: "${PBM_BOOTSTRAP_ADMIN_PASSWORD:?Set PBM_BOOTSTRAP_ADMIN_PASSWORD in .env}"
      Cors__AllowedOrigins__0: "http://localhost:3000"
      RateLimiting__Login__PermitLimit: "10"
      RateLimiting__Login__WindowSeconds: "60"
      Outbox__PollSeconds: "${PBM_OUTBOX_POLL_SECONDS:-5}"
      Outbox__BatchSize: "${PBM_OUTBOX_BATCH_SIZE:-20}"
      Outbox__LockSeconds: "${PBM_OUTBOX_LOCK_SECONDS:-120}"
      Outbox__MaxAttempts: "${PBM_OUTBOX_MAX_ATTEMPTS:-8}"
      Outbox__BaseDelaySeconds: "${PBM_OUTBOX_BASE_DELAY_SECONDS:-15}"
      Outbox__MaxDelaySeconds: "${PBM_OUTBOX_MAX_DELAY_SECONDS:-3600}"
      OutboundNotifications__Webhook__Enabled: "${PBM_NOTIFICATION_WEBHOOK_ENABLED:-false}"
      OutboundNotifications__Webhook__Url: "${PBM_NOTIFICATION_WEBHOOK_URL:-}"
      OutboundNotifications__Webhook__AllowHttp: "${PBM_NOTIFICATION_WEBHOOK_ALLOW_HTTP:-false}"
      OutboundNotifications__Webhook__BearerToken: "${PBM_NOTIFICATION_WEBHOOK_BEARER_TOKEN:-}"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  web:
    build:
      context: .
      dockerfile: src/PBM.Web/Dockerfile
    depends_on:
      - api
    ports:
      - "3000:80"

volumes:
  pbm_sql_data:
