name: Apply structured master data navigation

on:
  push:
    branches:
      - feat/initial-platform
    paths:
      - .github/workflows/apply-structured-navigation.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/initial-platform
          fetch-depth: 0

      - name: Patch App navigation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/PBM.Web/src/App.tsx')
          s = p.read_text(encoding='utf-8')

          def repl(old, new):
              global s
              if old not in s:
                  raise SystemExit('Expected App.tsx block not found:\n' + old[:220])
              s = s.replace(old, new, 1)

          repl("import ReferenceAdmin from './ReferenceAdmin'\nimport MasterDataWorkspace from './MasterDataWorkspace'\n", "import SidebarTree from './SidebarTree'\nimport { masterDataTree, settingsTree } from './NavigationTrees'\nimport StructuredMasterDataWorkspace from './StructuredMasterDataWorkspace'\nimport SystemSettingsWorkspace from './SystemSettingsWorkspace'\n")

          repl("function viewIndexFromHash() {\n  const hash = window.location.hash.replace(/^#/, '').toLowerCase()\n  const index = viewHashes.findIndex(x => x === hash)\n  return index >= 0 ? index : 0\n}", "function viewIndexFromHash() {\n  const hash = window.location.hash.replace(/^#/, '').toLowerCase()\n  const root = hash.split('/')[0]\n  const index = viewHashes.findIndex(x => x === root)\n  return index >= 0 ? index : 0\n}")

          repl("  const [activeView, setActiveView] = useState(viewIndexFromHash)\n  const [passwordDialogOpen, setPasswordDialogOpen] = useState(false)\n  const [budgetMenuOpen, setBudgetMenuOpen] = useState(true)\n  const [controlMenuOpen, setControlMenuOpen] = useState(false)\n  const [operationsMenuOpen, setOperationsMenuOpen] = useState(false)\n", "  const [activeView, setActiveView] = useState(viewIndexFromHash)\n  const [currentHash, setCurrentHash] = useState(() => window.location.hash.replace(/^#/, '').toLowerCase())\n  const [passwordDialogOpen, setPasswordDialogOpen] = useState(false)\n  const [budgetMenuOpen, setBudgetMenuOpen] = useState(true)\n  const [controlMenuOpen, setControlMenuOpen] = useState(false)\n  const [operationsMenuOpen, setOperationsMenuOpen] = useState(false)\n  const [masterDataMenuOpen, setMasterDataMenuOpen] = useState(activeView === 18)\n  const [settingsMenuOpen, setSettingsMenuOpen] = useState(activeView === 17)\n")

          repl("  useEffect(() => { const onHashChange = () => setActiveView(viewIndexFromHash()); window.addEventListener('hashchange', onHashChange); return () => window.removeEventListener('hashchange', onHashChange) }, [])\n", "  useEffect(() => {\n    const onHashChange = () => {\n      setActiveView(viewIndexFromHash())\n      setCurrentHash(window.location.hash.replace(/^#/, '').toLowerCase())\n    }\n    window.addEventListener('hashchange', onHashChange)\n    return () => window.removeEventListener('hashchange', onHashChange)\n  }, [])\n")

          repl("    if (operationsViews.includes(activeView)) setOperationsMenuOpen(true)\n  }, [activeView])\n\n  const selectView = (index: number) => { setActiveView(index); const hash = viewHashes[index] ?? viewHashes[0]; if (window.location.hash !== `#${hash}`) window.location.hash = hash }\n", "    if (operationsViews.includes(activeView)) setOperationsMenuOpen(true)\n    if (activeView === 18) setMasterDataMenuOpen(true)\n    if (activeView === 17) setSettingsMenuOpen(true)\n  }, [activeView])\n\n  const selectView = (index: number) => {\n    setActiveView(index)\n    const hash = viewHashes[index] ?? viewHashes[0]\n    setCurrentHash(hash)\n    if (window.location.hash !== `#${hash}`) window.location.hash = hash\n  }\n  const selectNestedView = (index: number, root: 'master-data' | 'settings', path: string) => {\n    const hash = `${root}/${path}`\n    setActiveView(index); setCurrentHash(hash)\n    if (window.location.hash !== `#${hash}`) window.location.hash = hash\n  }\n  const selectedMasterPath = currentHash.startsWith('master-data/') ? currentHash.slice('master-data/'.length) : ''\n  const selectedSettingsPath = currentHash.startsWith('settings/') ? currentHash.slice('settings/'.length) : ''\n")

          repl("          <Divider sx={{ borderColor: 'rgba(255,255,255,.08)', my: 1 }} />\n          {navItem(18, 'اطلاعات پایه', <Inventory2RoundedIcon />)}\n          {navItem(17, 'تنظیمات', <SettingsRoundedIcon />)}\n", "          <Divider sx={{ borderColor: 'rgba(255,255,255,.08)', my: 1 }} />\n          <SidebarTree title=\"اطلاعات پایه\" icon={<Inventory2RoundedIcon />} selectedPath={selectedMasterPath} nodes={masterDataTree} open={masterDataMenuOpen} onToggle={() => setMasterDataMenuOpen(x => !x)} onSelect={path => selectNestedView(18, 'master-data', path)} />\n          <SidebarTree title=\"تنظیمات\" icon={<SettingsRoundedIcon />} selectedPath={selectedSettingsPath} nodes={settingsTree} open={settingsMenuOpen} onToggle={() => setSettingsMenuOpen(x => !x)} onSelect={path => selectNestedView(17, 'settings', path)} />\n")

          s = s.replace('از «تنظیمات ← تقویم مالی» سال مالی را ایجاد کنید.', 'از «اطلاعات پایه ← برنامه‌ریزی و مالی ← تقویم» سال مالی را ایجاد کنید.')

          repl("        {!loading && activeView === 17 && <ReferenceAdmin companyId={companyId} roles={roles} />}\n        {!loading && activeView === 18 && <MasterDataWorkspace companyId={companyId} roles={roles} />}\n", "        {!loading && activeView === 17 && <SystemSettingsWorkspace companyId={companyId} roles={roles} section={selectedSettingsPath} />}\n        {!loading && activeView === 18 && <StructuredMasterDataWorkspace companyId={companyId} roles={roles} section={selectedMasterPath} />}\n")

          p.write_text(s, encoding='utf-8')
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build web
        working-directory: src/PBM.Web
        run: |
          npm install
          npm run build

      - name: Commit navigation
        shell: bash
        run: |
          set -euo pipefail
          git add src/PBM.Web/src/App.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Implement structured master data sidebar hierarchy"
          git push origin HEAD:feat/initial-platform
