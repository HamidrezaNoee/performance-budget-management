name: Finalize structured master data navigation

on:
  push:
    branches:
      - feat/initial-platform
    paths:
      - .github/workflows/apply-structured-navigation.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/initial-platform
          fetch-depth: 0

      - name: Patch direct entity navigation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'Expected block not found in {path}: {old[:180]}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')

          master = 'src/PBM.Web/src/MasterDataAdmin.tsx'
          replace(master,
            "export default function MasterDataAdmin({ companyId, roles }: { companyId: string; roles: string[] }) {",
            "export default function MasterDataAdmin({ companyId, roles, initialDimensionCode }: { companyId: string; roles: string[]; initialDimensionCode?: string }) {"
          )
          replace(master,
            "  const canGlobal = roleSet.has('SUPERADMIN') || roleSet.has('ADMIN')\n\n  const [dimensions, setDimensions] = useState<Dimension[]>([])",
            "  const canGlobal = roleSet.has('SUPERADMIN') || roleSet.has('ADMIN')\n  const lockedDimensionCode = initialDimensionCode?.trim().toUpperCase() ?? ''\n\n  const [dimensions, setDimensions] = useState<Dimension[]>([])"
          )
          replace(master,
            "      const product = response.data.find(x => x.code.toUpperCase() === 'PRODUCT')\n      const nextId = product?.id ?? response.data.find(x => operationalCodes.has(x.code.toUpperCase()))?.id ?? ''",
            "      const requested = lockedDimensionCode ? response.data.find(x => x.code.toUpperCase() === lockedDimensionCode) : undefined\n      const product = response.data.find(x => x.code.toUpperCase() === 'PRODUCT')\n      const nextId = requested?.id ?? product?.id ?? response.data.find(x => operationalCodes.has(x.code.toUpperCase()))?.id ?? ''"
          )
          replace(master,
            "  useEffect(() => { void loadDimensions() }, [companyId])",
            "  useEffect(() => { void loadDimensions() }, [companyId, lockedDimensionCode])"
          )
          replace(master,
            "      <FormControl size=\"small\" sx={{ minWidth: 320, mb: 2 }}><InputLabel>نوع اطلاعات پایه</InputLabel><Select label=\"نوع اطلاعات پایه\" value={dimensionId} onChange={e => setDimensionId(e.target.value)}>{visibleDimensions.map(item => <MenuItem key={item.id} value={item.id}>{labels[item.code.toUpperCase()] ?? item.name}</MenuItem>)}</Select></FormControl>",
            "      {!lockedDimensionCode && <FormControl size=\"small\" sx={{ minWidth: 320, mb: 2 }}><InputLabel>نوع اطلاعات پایه</InputLabel><Select label=\"نوع اطلاعات پایه\" value={dimensionId} onChange={e => setDimensionId(e.target.value)}>{visibleDimensions.map(item => <MenuItem key={item.id} value={item.id}>{labels[item.code.toUpperCase()] ?? item.name}</MenuItem>)}</Select></FormControl>}"
          )
          replace(master,
            "<MenuItem value=\"Province\">استان / ایالت</MenuItem><MenuItem value=\"City\">شهر</MenuItem><MenuItem value=\"Village\">روستا</MenuItem><MenuItem value=\"District\">بخش / ناحیه</MenuItem><MenuItem value=\"Other\">سایر</MenuItem>",
            "<MenuItem value=\"Province\">استان / ایالت</MenuItem><MenuItem value=\"County\">شهرستان</MenuItem><MenuItem value=\"City\">شهر</MenuItem><MenuItem value=\"District\">بخش / ناحیه</MenuItem><MenuItem value=\"RuralDistrict\">دهستان</MenuItem><MenuItem value=\"Village\">روستا</MenuItem><MenuItem value=\"Other\">سایر</MenuItem>"
          )

          workspace = 'src/PBM.Web/src/StructuredMasterDataWorkspace.tsx'
          replace(workspace,
            "      <Typography color=\"text.secondary\" mt={.5}>این موجودیت در موتور اطلاعات پایه فعال است. در فرم زیر نوع «{dimension}» را انتخاب کنید؛ در گام بعد Deep-Link مستقیم هر نوع نیز تکمیل می‌شود.</Typography>",
            "      <Typography color=\"text.secondary\" mt={.5}>این موجودیت در موتور اطلاعات پایه فعال است و فرم ثبت/ویرایش آن مستقیماً برای همین نوع باز شده است.</Typography>"
          )
          replace(workspace,
            "    {companyId ? <MasterDataAdmin companyId={companyId} roles={roles} /> : <Alert severity=\"warning\">برای مدیریت این اطلاعات ابتدا باید یک شرکت در دسترس باشد.</Alert>}",
            "    {companyId ? <MasterDataAdmin companyId={companyId} roles={roles} initialDimensionCode={dimension} /> : <Alert severity=\"warning\">برای مدیریت این اطلاعات ابتدا باید یک شرکت در دسترس باشد.</Alert>}"
          )

          app = 'src/PBM.Web/src/App.tsx'
          replace(app, "const drawerWidth = 280", "const drawerWidth = 320")
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build web
        working-directory: src/PBM.Web
        run: |
          npm install
          npm run build

      - name: Commit final navigation
        shell: bash
        run: |
          set -euo pipefail
          git add src/PBM.Web/src/App.tsx src/PBM.Web/src/MasterDataAdmin.tsx src/PBM.Web/src/StructuredMasterDataWorkspace.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Finalize structured master data navigation"
          git push origin HEAD:feat/initial-platform
