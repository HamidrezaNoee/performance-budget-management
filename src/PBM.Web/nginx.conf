server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Authentication is bearer-token based. Forward Authorization explicitly so
    # proxy configuration changes cannot accidentally drop the client token.
    proxy_set_header Authorization $http_authorization;
  }

  location = /livez {
    proxy_pass http://api:8080/livez;
  }

  location = /healthz {
    proxy_pass http://api:8080/healthz;
  }

  location = /readyz {
    proxy_pass http://api:8080/readyz;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
