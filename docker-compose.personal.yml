name: pbm-personal

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${PBM_SA_PASSWORD:?Set PBM_SA_PASSWORD in .env.personal}"
    ports:
      - "127.0.0.1:${PBM_SQL_PORT:-1433}:1433"
    volumes:
      - pbm_personal_sql_data:/var/opt/mssql
      - ${PBM_BACKUP_DIR:-./.pbm/backups}:/var/opt/mssql/backup
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '$${MSSQL_SA_PASSWORD}' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  api:
    build:
      context: .
      dockerfile: src/PBM.Api/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__PbmDatabase: "Server=db,1433;Database=PerformanceBudgetManagement;User Id=sa;Password=${PBM_SA_PASSWORD:?Set PBM_SA_PASSWORD in .env.personal};TrustServerCertificate=True;Encrypt=False"
      Jwt__Key: "${PBM_JWT_KEY:?Set PBM_JWT_KEY in .env.personal}"
      Jwt__Issuer: "${PBM_JWT_ISSUER:-PBM.Personal}"
      Jwt__Audience: "${PBM_JWT_AUDIENCE:-PBM.Web}"
      Database__AutoMigrate: "true"
      Database__AllowEnsureCreated: "false"
      Bootstrap__UseDemoSeed: "false"
      Bootstrap__AllowDemoSeedOutsideDevelopment: "false"
      Bootstrap__ProvisionInitialTenant: "${PBM_PROVISION_INITIAL_TENANT:-true}"
      Bootstrap__TenantCode: "${PBM_TENANT_CODE:-PERSONAL}"
      Bootstrap__TenantName: "${PBM_TENANT_NAME:-PBM Personal}"
      Bootstrap__CompanyCode: "${PBM_COMPANY_CODE:-COMPANY-01}"
      Bootstrap__CompanyName: "${PBM_COMPANY_NAME:-شرکت اصلی}"
      Bootstrap__Industry: "${PBM_COMPANY_INDUSTRY:-General}"
      Bootstrap__LicenseKey: "${PBM_LICENSE_KEY:-PERSONAL-PBM-LICENSE}"
      Bootstrap__LicenseDays: "${PBM_LICENSE_DAYS:-3650}"
      Bootstrap__MaxCompanies: "${PBM_MAX_COMPANIES:-5}"
      Bootstrap__MaxUsers: "${PBM_MAX_USERS:-100}"
      BootstrapAdmin__UserName: "${PBM_ADMIN_USERNAME:-admin}"
      BootstrapAdmin__DisplayName: "${PBM_ADMIN_DISPLAY_NAME:-مدیر سامانه}"
      BootstrapAdmin__Password: "${PBM_ADMIN_PASSWORD:?Set PBM_ADMIN_PASSWORD in .env.personal}"
      Cors__AllowedOrigins__0: "http://localhost:${PBM_WEB_PORT:-3000}"
      RateLimiting__Login__PermitLimit: "10"
      RateLimiting__Login__WindowSeconds: "60"
      IntegrationAuth__TokenMinutes: "15"
      Outbox__BatchSize: "20"
      Outbox__MaxAttempts: "8"
      Outbox__BaseDelaySeconds: "15"
      Outbox__MaxDelaySeconds: "3600"
      OutboundNotifications__Webhook__Enabled: "false"
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8080"

  web:
    build:
      context: .
      dockerfile: src/PBM.Web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:${PBM_WEB_PORT:-3000}:80"

volumes:
  pbm_personal_sql_data:
    name: pbm_personal_sql_data
